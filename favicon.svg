<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <circle cx="16" cy="16" r="16" fill="#0d0e14"/>
  <!-- Outer ring -->
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#f5a623" stroke-width="1.8"/>
  <!-- Top line -->
  <line x1="16" y1="3" x2="16" y2="10.5" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- Bottom line -->
  <line x1="16" y1="21.5" x2="16" y2="29" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- Left line -->
  <line x1="3" y1="16" x2="10.5" y2="16" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- Right line -->
  <line x1="21.5" y1="16" x2="29" y2="16" stroke="#f5a623" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#f5a623"/>
</svg>
